<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- REVORA Logo Mark
       Huruf R dengan diagonal notch di kiri atas (bentuk seperti
       flag/panah) yang menciptakan kesan gerakan/recycle.
       Warna: Ink #0A0A0A -->

  <!-- Latar belakang bone (opsional untuk maskable icon) -->
  <rect width="512" height="512" fill="#F5F5F0"/>

  <!-- Logo mark centered dengan safe zone -->
  <g transform="translate(96, 78)" fill="#0A0A0A">
    <!--
      Huruf R besar berbentuk block:
      - Stem tegak kiri (lebar)
      - Bowl atas (rounded rectangle bolong)
      - Leg diagonal kanan bawah
    -->

    <!-- Stem kiri tegak -->
    <rect x="0" y="0" width="72" height="356"/>

    <!-- Top horizontal bar + bowl (R atas) - digambar sebagai satu path -->
    <path d="
      M 0 0
      L 232 0
      C 288 0, 320 44, 320 100
      C 320 156, 288 200, 232 200
      L 0 200
      L 0 140
      L 220 140
      C 244 140, 258 122, 258 100
      C 258 78, 244 60, 220 60
      L 0 60
      Z
    "/>

    <!-- Leg diagonal (kaki R bawah kanan) -->
    <path d="
      M 152 200
      L 232 200
      L 320 356
      L 236 356
      Z
    "/>

    <!-- Diagonal notch/slash di kiri atas — signature element yang bikin
         logo distinctive. Motif "R kedua" yang tersembunyi. -->
    <path d="
      M 20 0
      L 100 0
      L 20 140
      Z
    " fill="#F5F5F0"/>
  </g>
</svg>
